services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: pramaan_dev
      POSTGRES_DB: sih_project
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sih_project"]
      interval: 3s
      timeout: 3s
      retries: 20
    ports:
      - "5432:5432"
    volumes:
      - pramaan_postgres:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: pramaan
      MINIO_ROOT_PASSWORD: pramaan_demo_secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - pramaan_minio:/data

  backend:
    build: ./backend
    environment:
      PROJECT_NAME: PRAMAAN
      ENVIRONMENT: development
      POSTGRES_SERVER: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: pramaan_dev
      POSTGRES_DB: sih_project
      POSTGRES_DB_TEST: sih_project_test
      SECRET_KEY: local-demo-secret-change-before-deployment-123456789
      STORAGE_BACKEND: local
      STORAGE_LOCAL_ROOT: /data/documents
      MAX_UPLOAD_SIZE_BYTES: 26214400
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      ML1_BASE_URL: http://ml-services:8001
      ML1_CONNECT_TIMEOUT_SECONDS: 5
      ML1_READ_TIMEOUT_SECONDS: 120
      ML1_TOTAL_TIMEOUT_SECONDS: 125
      STORAGE_ROOT: /data/documents
      MAX_UPLOAD_SIZE_MB: 25
      ML_SERVICE_URL: http://ml-services:8001
      ML_REQUEST_TIMEOUT_SECONDS: 120
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ml-services:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - pramaan_documents:/data/documents

  worker:
    build: ./backend
    command: celery -A app.celery_app:celery_app worker --loglevel=INFO
    environment:
      PROJECT_NAME: PRAMAAN
      ENVIRONMENT: development
      POSTGRES_SERVER: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: pramaan_dev
      POSTGRES_DB: sih_project
      SECRET_KEY: local-demo-secret-change-before-deployment-123456789
      STORAGE_BACKEND: local
      STORAGE_LOCAL_ROOT: /data/documents
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      ML1_BASE_URL: http://ml-services:8001
      ML1_CONNECT_TIMEOUT_SECONDS: 5
      ML1_READ_TIMEOUT_SECONDS: 120
      ML1_TOTAL_TIMEOUT_SECONDS: 125
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ml-services:
        condition: service_healthy
    volumes:
      - pramaan_documents:/data/documents

  ml-services:
    build: ./ml-services
    environment:
      ML_DOCUMENT_ROOT: /data/documents
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "8001:8001"
    volumes:
      - pramaan_documents:/data/documents:ro

volumes:
  pramaan_postgres:
  pramaan_minio:
  pramaan_documents:
